        function removeEmptyRowsFromPopupContent(content, feature) {
            var tempDiv = document.createElement('div');
            tempDiv.innerHTML = content;
            var rows = tempDiv.querySelectorAll('tr');
            for (var i = 0; i < rows.length; i++) {
                var td = rows[i].querySelector('td.visible-with-data');
                var key = td ? td.id : '';
                if (td && td.classList.contains('visible-with-data') && feature.properties[key] == null) {
                    rows[i].parentNode.removeChild(rows[i]);
                }
            }
            return tempDiv.innerHTML;
        }
        // modify popup if contains media
        function addClassToPopupIfMedia(content, popup) {
            var tempDiv = document.createElement('div');
            tempDiv.innerHTML = content;
            var imgTd = tempDiv.querySelector('td img');
            if (imgTd) {
                var src = imgTd.getAttribute('src');
                if (/\.(jpg|jpeg|png|gif|bmp|webp|avif)$/i.test(src)) {
                    popup._contentNode.classList.add('media');
                    setTimeout(function () {
                        popup.update();
                    }, 10);
                } else if (/\.(mp3|wav|ogg|aac)$/i.test(src)) {
                    var audio = document.createElement('audio');
                    audio.controls = true;
                    audio.src = src;
                    imgTd.parentNode.replaceChild(audio, imgTd);
                    popup._contentNode.classList.add('media');
                    setTimeout(function () {
                        popup.setContent(tempDiv.innerHTML);
                        popup.update();
                    }, 10);
                } else if (/\.(mp4|webm|ogg|mov)$/i.test(src)) {
                    var video = document.createElement('video');
                    video.controls = true;
                    video.src = src;
                    video.style.width = "400px";
                    video.style.height = "300px";
                    video.style.maxHeight = "60vh";
                    video.style.maxWidth = "60vw";
                    imgTd.parentNode.replaceChild(video, imgTd);
                    popup._contentNode.classList.add('media');
                    // Aggiorna il popup quando il video carica i metadati
                    video.addEventListener('loadedmetadata', function () {
                        popup.update();
                    });
                    setTimeout(function () {
                        popup.setContent(tempDiv.innerHTML);
                        popup.update();
                    }, 10);
                } else {
                    popup._contentNode.classList.remove('media');
                }
            } else {
                popup._contentNode.classList.remove('media');
            }
        }

                        `<label style="display:block;cursor:pointer">` +
                        `<input type="checkbox" class="${clase}" value="${escapar(v)}" checked> ${escapar(v)}</label>`
                    ).join('');

                div.innerHTML =
                    '<div id="filtro-titulo" style="cursor:pointer;font-weight:bold;user-select:none">' +
                    '<span id="filtro-flecha">▾</span> Filtros · ' +
                    '<span id="filtro-conteo" style="font-weight:normal;color:#555"></span></div>' +

                    '<div style="height:8px"></div>' +

                    '<div style="margin-top:8px;border-top:1px solid #ddd;padding-top:6px"><b>Descargar</b><br>' +

                    '<a href="/api/exportar/mediciones.csv" download>Mediciones (CSV)</a></div>' +
                    '</div>';
                // Que los clics en el panel no lleguen al mapa (ni a la medición)
                L.DomEvent.disableClickPropagation(div);
                L.DomEvent.disableScrollPropagation(div);

                const rad = f.azimut * Math.PI / 180;
                const mLat = 111320;
                const mLon = 111320 * Math.cos(f.centro.lat * Math.PI / 180);
                const mover = (lat, lon, dist, ang) =>
                    [lat + dist * Math.cos(ang) / mLat, lon + dist * Math.sin(ang) / mLon];
                // Cuerpo de la flecha (termina donde empieza la punta)
                const inicio = mover(f.centro.lat, f.centro.lon, -LARGO_M / 2, rad);
                const fin = mover(f.centro.lat, f.centro.lon, LARGO_M / 2, rad);
                const basePunta = mover(fin[0], fin[1], -60, rad);
                const izq = mover(basePunta[0], basePunta[1], 30, rad - Math.PI / 2);
                const der = mover(basePunta[0], basePunta[1], 30, rad + Math.PI / 2);
                const RUMBOS = ['N', 'NE', 'E', 'SE', 'S', 'SO', 'O', 'NO'];
                const FLECHAS = ['↑', '↗', '→', '↘', '↓', '↙', '←', '↖'];
                const i = Math.round(f.azimut / 45) % 8;
                const mPorKm = (f.gradiente * 1000).toFixed(1);

                const texto =
                    '<b>Dirección preliminar del flujo</b><br>' +
                    `Hacia el ${RUMBOS[i]} (${f.azimut}° desde el norte)<br>` +
                    `Gradiente hidráulico: ${f.gradiente} (${mPorKm} m por km)<br>` +
                    `Pozos usados: ${f.pozos.join(', ')}<br>` +
                    '<i style="color:#777">Preliminar: elevación obtenida del CEM (15 m)</i>';

                const COLOR = '#dc2626';
                                // Etiqueta fija junto al inicio de la flecha (un marcador de solo texto)
                const etiqueta = L.marker(inicio, {
                    icon: L.divIcon({
                        className: '',
                        html: `<div style="background:#fff;padding:2px 6px;border-radius:4px;` +
                              `font:12px sans-serif;white-space:nowrap;box-shadow:0 1px 3px rgba(0,0,0,.4);` +
                              `transform:translate(-105%,-50%)"><b>Flujo ${FLECHAS[i]}</b> ${mPorKm} m/km</div>`
                    })
                });

                // Todo junto en una capa: triángulo, flecha y etiqueta
                const capaFlujo = L.layerGroup([
                    // Triángulo de los pozos usados
                    L.polygon(f.vertices, { color: COLOR, weight: 2, dashArray: '6 6', fillColor: COLOR, fillOpacity: 0.10 }),
                    // Borde blanco y cuerpo de la flecha
                    L.polyline([inicio, basePunta], { color: '#fff', weight: 10, opacity: 0.9, lineCap: 'butt' }),
                    L.polyline([inicio, basePunta], { color: COLOR, weight: 6, lineCap: 'butt' }),
                    // Punta
                    L.polygon([izq, fin, der], { color: '#fff', weight: 2, fillColor: COLOR, fillOpacity: 1 }),
                    etiqueta
                ]);   // sin .addTo(map): empieza apagada

                capaFlujo.eachLayer(capa => capa.bindPopup(texto));

                // Agregarla al control de capas
                overlaysTree.unshift({
                    label: `<span style="color:${COLOR};font-weight:bold">${FLECHAS[i]}</span> Dirección del flujo (preliminar)`,
                    layer: capaFlujo
                });
                lay.setOverlayTree(overlaysTree);

                capaFlujo.eachLayer(capa => capa.bindPopup(texto));

                // Etiqueta fija junto al inicio de la flecha
                L.tooltip({ permanent: true, direction: 'left', offset: [-8, 0] })
                    .setLatLng(inicio)
                    .setContent(`<b>Flujo ${FLECHAS[i]}</b> ${mPorKm} m/km`)
                    .addTo(map);

            })
            .catch(error => console.error('Flujo:', error));

        const NOMBRES_CONDICION = {
            estatico: 'Sin bombeo',
            dinamico: 'En bombeo',
            seco: 'Seco',
            sin_acceso: 'Sin acceso'
        };

        fetch('/api/pozos')

            .then(respuesta => {
                if (!respuesta.ok) throw new Error('Error del servidor: ' + respuesta.status);
                return respuesta.json();
            })
            .then(geojson => {
                const capaPozosBD = L.geoJSON(geojson, {
                    // Cómo se dibuja cada pozo: un círculo azul
                    pointToLayer: (feature, latlng) => {
                        const esCampo = feature.properties.tipo_fuente === 'campo';
                        // Coordenada de celular (precisión baja): borde naranja punteado
                        const deCelular = feature.properties.metodo_coordenada === 'celular';
                        return L.circleMarker(latlng, {
                            radius: esCampo ? 8 : 5,
                            fillColor: esCampo ? '#1d6e8c' : '#9aa5ad',
                            color: deCelular ? '#f59e0b' : '#ffffff',
                            dashArray: deCelular ? '3 2' : null,
                            weight: deCelular ? 3 : 2,
                            fillOpacity: 0.95,
                            pane: 'markerPane'
                        });
                    },
                    onEachFeature: (feature, layer) => {
                        const p = feature.properties;
                        const encabezado =
                            `<b>${p.codigo}</b> ${p.nombre || ''}<br>` +
                            `Uso: ${p.uso || 'Sin dato'}<br>` +
                            `Fuente: ${p.fuente} (${p.tipo_fuente})` +
                            (p.elevacion_terreno_m !== null
                                ? `<br>Elevación del terreno: ${Number(p.elevacion_terreno_m).toLocaleString('es-MX')} msnm (CEM)`
                                : '') +
                            `<br>Coordenada: ${METODOS_COORDENADA[p.metodo_coordenada] || 'sin dato'}`;
                        layer.bindPopup(encabezado + '<br><i>Cargando mediciones…</i>', { maxHeight: 320, minWidth: 260 });

                        // Cuando se abre el popup, pedir las mediciones de ese pozo
                        layer.on('popupopen', () => {
                            Promise.all([
                                fetch(`/api/pozos/${p.id_pozo}/mediciones`).then(r => r.json()),
                                fetch(`/api/pozos/${p.id_pozo}/concesiones`).then(r => r.json())
                            ])
                                .then(([mediciones, concesiones]) => {
                                    let html = encabezado;

                                    // Concesiones del REPDA
                                    if (concesiones.length > 0) {
                                        html += '<hr><b>Concesión REPDA</b><br>';
                                        concesiones.forEach(c => {
                                            html += `Título: ${escapar(c.titulo)}<br>`;
                                            if (c.titular) html += `Titular: ${escapar(c.titular)}<br>`;
                                            if (c.volumen_m3_anual !== null) {
                                                const m3 = Number(c.volumen_m3_anual);
                                                const ls = m3 * 1000 / 31536000;
                                                html += `Volumen concesionado: ${m3.toLocaleString('es-MX')} m³/año (${ls.toFixed(2)} L/s)<br>`;
                                            } else {
                                                html += 'Volumen concesionado: sin dato<br>';
                                            }
                                            if (c.volumen_dudoso) {
                                                html += '<span style="color:#b45309">⚠ Volumen dudoso: verificar en el REPDA</span><br>';
                                            }
                                        });
                                    }

                                    // Mediciones de campo
                                    html += '<hr><b>Mediciones</b><br>';
                                    if (mediciones.length === 0) html += 'Sin mediciones';
                                    mediciones.forEach(m => {
                                        const fecha = new Date(m.fecha_hora).toLocaleDateString('es-MX');
                                        const nivel = m.profundidad_nivel_m !== null
                                            ? 'profundidad ' + Number(m.profundidad_nivel_m).toFixed(2) + ' m'
                                            : '—';
                                        html += `${fecha}: ${nivel} (${NOMBRES_CONDICION[m.condicion] || m.condicion})<br>`;
                                        // Trazabilidad: campaña y, con sesión, quién la registró
                                        const origen = [m.campana ? escapar(m.campana) : null,
                                                        m.registro ? 'registró: ' + escapar(m.registro) : null].filter(Boolean);
                                        if (origen.length > 0) {
                                            html += `&nbsp;&nbsp;<span style="color:#777;font-size:11px">${origen.join(' · ')}</span><br>`;
                                        }
                                        if (m.nivel_estatico_msnm !== null) {
                                            html += `&nbsp;&nbsp;→ <b>Nivel estático: ${Number(m.nivel_estatico_msnm).toLocaleString('es-MX', { minimumFractionDigits: 2 })} msnm</b><br>`;
                                        }
                                        if (m.alerta) html += `<span style="color:#b45309">⚠ Revisar: ${m.alerta}</span><br>`;
                                    });

                                    // Serie para la gráfica: solo mediciones sin bombeo, de la más antigua a la más reciente
                                    const serie = mediciones
                                        .filter(m => m.condicion === 'estatico' && m.profundidad_nivel_m !== null)
                                        .reverse();

                                    if (serie.length >= 2) {
                                        html += `<div style="width:100%;height:150px;margin-top:6px">` +
                                            `<canvas id="grafica-${p.id_pozo}"></canvas></div>`;
                                    } else if (mediciones.length > 0) {
                                        html += '<i style="color:#777">Se necesitan al menos 2 mediciones sin bombeo para la gráfica</i>';
                                    }

                                    layer.setPopupContent(html);

                                    // Dibujar la gráfica (después de que el canvas ya existe en el popup)
                                    if (serie.length >= 2) {
                                        if (layer.grafica) layer.grafica.destroy();
                                        layer.grafica = new Chart(document.getElementById(`grafica-${p.id_pozo}`), {
                                            type: 'line',
                                            data: {
                                                labels: serie.map(m => new Date(m.fecha_hora).toLocaleDateString('es-MX')),
                                                datasets: [{
                                                    data: serie.map(m => Number(m.profundidad_nivel_m)),
                                                    borderColor: '#2563eb',
                                                    backgroundColor: '#2563eb'
                                                }]
                                            },
                                            options: {
                                                animation: false,
                                                maintainAspectRatio: false,
                                                plugins: { legend: { display: false } },
                                                scales: {
                                                    y: { reverse: true, title: { display: true, text: 'Profundidad (m)' } }
                                                }
                                            }
                                        });
                                    }

                                    // Recolocar el popup ya con todo su contenido, para que no se salga del mapa
                                    const popup = layer.getPopup();
                                    if (popup._adjustPan) popup._adjustPan();
                                })
                                .catch(() => {
                                    layer.setPopupContent(encabezado + '<br>No se pudieron cargar las mediciones');
                                });
                        });
                    }
                }).addTo(map);
                // Agregar la capa al control de capas, con su leyenda
                const circulo = color =>
                    `<span style="display:inline-block;width:11px;height:11px;border-radius:50%;` +
                    `background:${color};border:2px solid #fff;box-shadow:0 0 0 1px #999"></span>`;

                overlaysTree.unshift({
                    label: 'Pozos (base de datos)<br><table>' +
                        `<tr><td style="text-align:center">${circulo('#1d6e8c')}</td><td>De campo</td></tr>` +
                        `<tr><td style="text-align:center">${circulo('#9aa5ad')}</td><td>Otras fuentes</td></tr>` +
                        `<tr><td style="text-align:center"><span style="display:inline-block;width:11px;height:11px;border-radius:50%;` +
                        `border:2px dashed #f59e0b"></span></td><td>Coordenada de celular</td></tr>` +
                        '</table>',
                    layer: capaPozosBD
                });
                lay.setOverlayTree(overlaysTree);
                crearFiltros(geojson, capaPozosBD);
                console.log('Pozos cargados desde la base de datos:', geojson.features.length);
            })
            .catch(error => {
                console.error('No se pudieron cargar los pozos de la base de datos:', error);
            });

        // ------------------------------------------------------------
        // Medición de distancias (la activa el botón MEDIR de la página)
        // ------------------------------------------------------------
        var medicion = { activa: false, puntos: [], marcas: L.layerGroup().addTo(map), linea: null };

        function limpiarMedicion() {
            medicion.puntos = [];
            medicion.marcas.clearLayers();
            if (medicion.linea) {
                map.removeLayer(medicion.linea);
                medicion.linea = null;
            }
        }

        map.on('click', function (e) {
            if (!medicion.activa) return;

            medicion.puntos.push(e.latlng);
            L.circleMarker(e.latlng, {
                radius: 5, color: '#7a4b00', weight: 2, fillColor: '#f2b33d', fillOpacity: 1
            }).addTo(medicion.marcas);

            if (medicion.puntos.length < 2) return;

            if (medicion.linea) map.removeLayer(medicion.linea);
            medicion.linea = L.polyline(medicion.puntos, { color: '#b7791f', weight: 3, dashArray: '6 6' }).addTo(map);

            var metros = 0;
            for (var i = 0; i < medicion.puntos.length - 1; i++) {
                metros += medicion.puntos[i].distanceTo(medicion.puntos[i + 1]);
            }
            window.parent.postMessage({ tipo: 'DISTANCIA_CALCULADA', metros: metros }, '*');
        });

        window.addEventListener('message', function (e) {
            if (e.data && e.data.tipo === 'MODO_MEDICION') {
                medicion.activa = !!e.data.activo;
                limpiarMedicion();
                map.getContainer().style.cursor = medicion.activa ? 'crosshair' : '';
            }
        });



        // Panel "Resumen de la microcuenca": cifras que calcula el servidor a partir de la base de datos
        fetch('/api/resumen')
            .then(r => r.json())
            .then(d => {
                if (d.error) return;
                const num = (v, dec = 0) => Number(v).toLocaleString('es-MX', { minimumFractionDigits: dec, maximumFractionDigits: dec });
                const ls = d.concesiones.volumen * 1000 / 31536000;
                const ultima = d.mediciones.ultima ? new Date(d.mediciones.ultima).toLocaleDateString('es-MX') : 'sin mediciones';
                const fila = (etiqueta, valor) =>
                    `<tr><td style="padding:1px 8px 1px 0;color:#555">${etiqueta}</td><td style="text-align:right"><b>${valor}</b></td></tr>`;

                const control = L.control({ position: 'bottomright' });
                control.onAdd = function () {
                    const div = L.DomUtil.create('div');
                    div.style.cssText = 'background:#fff;padding:8px 12px;border-radius:8px;' +
                        'box-shadow:0 1px 5px rgba(0,0,0,.35);font:12px sans-serif;max-height:340px;overflow:auto;max-width:280px';
                    div.innerHTML =
                        '<div id="resumen-titulo" style="cursor:pointer;font-weight:bold;user-select:none">' +
                        '<span id="resumen-flecha">▸</span> Resumen de la microcuenca</div>' +
                        '<div id="resumen-contenido" style="display:none;margin-top:6px">' +
                        '<table style="border-collapse:collapse">' +
                        fila('Pozos', `${num(d.pozos.total)}`) +
                        fila('&nbsp;&nbsp;de campo', num(d.pozos.campo)) +
                        fila('&nbsp;&nbsp;de otras fuentes', num(d.pozos.total - d.pozos.campo)) +
                        '</table>' +
                        '<div style="margin-top:6px"><b>Pozos por uso</b></div><table style="border-collapse:collapse">' +
                        d.usos.map(u => fila(escapar(u.uso), num(u.n))).join('') +
                        '</table>' +
                        '<div style="margin-top:6px"><b>Concesiones (REPDA)</b></div><table style="border-collapse:collapse">' +
                        fila('Registros', num(d.concesiones.total)) +
                        fila('Volumen anual', `${num(d.concesiones.volumen / 1e6, 2)} hm³`) +
                        fila('Equivale a', `${num(ls, 1)} L/s`) +
                        '</table>' +
                        (d.concesiones.dudosos > 0
                            ? `<div style="color:#b45309">⚠ ${d.concesiones.dudosos} volumen dudoso no se suma</div>` : '') +
                        '<div style="margin-top:6px"><b>Monitoreo</b></div><table style="border-collapse:collapse">' +
                        fila('Mediciones', num(d.mediciones.total)) +
                        fila('Última medición', ultima) +
                        fila('Pozos con nivel estático', num(d.niveles.pozos)) +
                        (d.niveles.pozos > 0
                            ? fila('Rango del nivel', `${num(d.niveles.minimo)}–${num(d.niveles.maximo)} msnm`) : '') +
                        '</table>' +
                        '<div style="margin-top:6px;color:#777">Volumen concesionado ≠ volumen extraído</div>' +
                        '</div>';
                    L.DomEvent.disableClickPropagation(div);
                    L.DomEvent.disableScrollPropagation(div);
                    const contenido = div.querySelector('#resumen-contenido');
                    const flecha = div.querySelector('#resumen-flecha');
                    div.querySelector('#resumen-titulo').addEventListener('click', () => {
                        const oculto = contenido.style.display === 'none';
                        contenido.style.display = oculto ? '' : 'none';
                        flecha.textContent = oculto ? '▾' : '▸';
                    });
                    return div;
                };
                control.addTo(map);
            })
            .catch(error => console.error('No se pudo cargar el resumen:', error));

        // Botón "Volver a la plataforma": solo aparece cuando el mapa está en pantalla completa
        // (si el mapa está dentro de la página principal, no hace falta)
        if (window.self === window.top) {
            const volver = L.control({ position: 'topleft' });
            volver.onAdd = function () {
                const a = L.DomUtil.create('a');
                a.href = '../index.html';
                a.textContent = '← Volver a la plataforma';
                a.style.cssText = 'display:block;background:#fff;color:#334155;padding:7px 12px;border-radius:8px;' +
                    'box-shadow:0 1px 5px rgba(0,0,0,.35);font:bold 12px sans-serif;text-decoration:none';
                L.DomEvent.disableClickPropagation(a);
                return a;
            };
            volver.addTo(map);
        }

        // Mientras se mide, no abrir las ventanas de información de las capas
        map.on('popupopen', function () {
            if (medicion.activa) map.closePopup();
        });

    </script>
